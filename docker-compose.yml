version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: API/Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Pass your HF token into the container (either via .env or exported env var)
      - HF_TOKEN=${HF_TOKEN}
      # Persist and share the model cache so downloads survive rebuilds
      - HF_CACHE=/hf_cache
      - HUGGINGFACE_HUB_CACHE=/hf_cache
    volumes:
      - hf_cache:/hf_cache
    restart: unless-stopped
    networks:
      - rag_network
    # --- Optional GPU support ---
    # Uncomment ONE of the following if you run with NVIDIA GPUs:
    gpus: all
    # device_requests:
    #   - capabilities: ["gpu"]

  frontend:
    build:
      context: .
      dockerfile: UI/Dockerfile
    ports:
      - "8501:8501"
    environment:
      
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - rag_network

volumes:
  hf_cache:

networks:
  rag_network:
    driver: bridge




