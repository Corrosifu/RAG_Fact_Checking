# Local / on-prem deployment. CPU-only by default.
#   docker compose run --rm backend ragfc sample && docker compose run --rm backend ragfc index
#   docker compose up --build
# GPU / neural models: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up --build
services:
  backend:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: [{ path: .env, required: false }]
    environment:
      HF_HOME: /hf_cache
    ports: ["8000:8000"]
    volumes:
      - ./data:/app/data
      - hf_cache:/hf_cache
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["8501:8501"]
    depends_on: [backend]
    restart: unless-stopped

volumes:
  hf_cache:
