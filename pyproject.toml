[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-fact-checking"
version = "0.2.0"
description = "Lightweight, explainable RAG system for scientific fact-checking that runs on a small machine."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Corrosifu" }]
dependencies = ["numpy>=1.26", "requests>=2.31"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
ui = ["streamlit>=1.35"]
ml = ["sentence-transformers>=3.0", "transformers>=4.44", "torch>=2.2"]
pdf = ["pypdf>=4.0"]
faiss = ["faiss-cpu>=1.8"]
eval = ["ragas>=0.2", "pandas>=2.0", "datasets"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
ragfc = "rag_fact_checking.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rag_fact_checking = ["sample/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["rag_fact_checking"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["UP037"]
